name: Core Lite Runtime Soak

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Soak duration in minutes
        required: false
        default: "30"
  schedule:
    - cron: "17 3 * * 0"

jobs:
  runtime-soak:
    name: Core Lite lifecycle soak and benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Runtime benchmark
        run: npm run test:benchmark

      - name: Core Lite lifecycle soak
        env:
          SOAK_MINUTES: ${{ github.event.inputs.minutes || '30' }}
          CORE_LITE_STRESS_REPORT: test-results/core-lite-4.8/scheduled-soak.json
        run: |
          node tests/performance/core-lite-lifecycle-soak.mjs \
            --seconds=$((SOAK_MINUTES * 60)) \
            --iterations=500000 \
            --subprocess-every=500

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-lite-4.8-scheduled-soak
          path: test-results/core-lite-4.8/
          if-no-files-found: error
          retention-days: 30
